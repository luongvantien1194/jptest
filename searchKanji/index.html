<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nhận dạng Kanji</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-color: #007AFF;
            --danger-color: #FF3B30;
            --text-color: #1C1C1E;
            --text-secondary: #8E8E93;
            --border-color: #E5E5EA;
            --radius-large: 24px;
            --radius-medium: 16px;
            --radius-small: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.85);
                --text-color: #FFFFFF;
                --text-secondary: #8E8E93;
                --border-color: #38383A;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px) 16px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .main-card {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-large);
            padding: 14px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 0.8;
            background-color: #FFFFFF;
            border-radius: var(--radius-medium);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
        }

        /* Khung đường nét đứt định vị chữ */
        .canvas-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px dashed #E5E5EA;
            pointer-events: none;
        }

        .canvas-container::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 1px dashed #E5E5EA;
            pointer-events: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
            position: relative;
            z-index: 1;
        }

        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-small);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-clear {
            background-color: rgba(255, 59, 48, 0.1);
            color: var(--danger-color);
        }

        .btn-clear:active {
            background-color: rgba(255, 59, 48, 0.2);
            transform: scale(0.98);
        }

        .btn-camera {
            background-color: rgba(0, 122, 255, 0.1);
            color: var(--primary-color);
        }

        .btn-camera:active {
            background-color: rgba(0, 122, 255, 0.2);
            transform: scale(0.98);
        }

        .btn-camera:disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-toggle-draw {
            background-color: rgba(142, 142, 147, 0.12);
            color: var(--text-color);
        }

        .btn-toggle-draw:active {
            background-color: rgba(142, 142, 147, 0.22);
            transform: scale(0.98);
        }

        .btn-toggle-draw.active {
            background-color: rgba(0, 122, 255, 0.1);
            color: var(--primary-color);
        }

        .canvas-wrap {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .canvas-wrap.active {
            display: flex;
        }

        .results-section {
            width: 100%;
            max-width: 360px;
            margin-top: 12px;
        }

        .results-section h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .kanji-btn {
            min-height: 56px;
            padding: 6px 2px;
            color: var(--text-color);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.15s ease;
        }

        .kanji-btn .kanji-char {
            font-size: 22px;
            font-weight: 500;
            line-height: 1;
        }

        .kanji-btn .kanji-reading {
            font-size: 9px;
            font-weight: 400;
            line-height: 1.1;
            color: var(--text-secondary);
            text-align: center;
        }

        .kanji-btn:active {
            transform: scale(0.92);
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .kanji-btn:active .kanji-char,
        .kanji-btn:active .kanji-reading {
            color: #FFFFFF;
        }

        .empty-state {
            grid-column: span 5;
            text-align: center;
            padding: 20px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== Crop overlay ===== */
        .crop-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px) 16px;
            gap: 16px;
        }

        .crop-overlay.active {
            display: flex;
        }

        .crop-stage {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 75vh;
            touch-action: none;
        }

        #cropImage {
            display: block;
            max-width: 100%;
            max-height: 75vh;
            width: auto;
            height: auto;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        .crop-box {
            position: absolute;
            border: 2px solid #FFFFFF;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.55);
            touch-action: none;
            cursor: move;
        }

        .crop-handle {
            position: absolute;
            width: 22px;
            height: 22px;
            background: #FFFFFF;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            touch-action: none;
            transform: translate(-50%, -50%);
        }

        .handle-tl { top: 0; left: 0; cursor: nwse-resize; }
        .handle-tr { top: 0; left: 100%; cursor: nesw-resize; }
        .handle-bl { top: 100%; left: 0; cursor: nesw-resize; }
        .handle-br { top: 100%; left: 100%; cursor: nwse-resize; }

        .crop-hint {
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            text-align: center;
        }

        .crop-actions {
            width: 100%;
            max-width: 360px;
            display: flex;
            gap: 10px;
        }

        .composed-section {
            width: 100%;
            max-width: 360px;
            margin-top: 10px;
        }

        .composed-section h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            padding-left: 4px;
        }

        .composed-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            padding: 6px;
            box-shadow: var(--shadow);
        }

        .composed-chips {
            flex: 1;
            min-width: 0;
            min-height: 32px;
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
        }

        .composed-empty {
            color: var(--text-secondary);
            font-size: 12px;
            white-space: nowrap;
        }

        .composed-chip {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 122, 255, 0.1);
            color: var(--primary-color);
            border: none;
            border-radius: 10px;
            padding: 4px 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .composed-chip-remove {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .composed-chip:active {
            background: rgba(0, 122, 255, 0.2);
        }

        .composed-icon-btn {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .composed-clear-btn {
            background-color: rgba(255, 59, 48, 0.1);
            color: var(--danger-color);
        }

        .composed-clear-btn:active {
            background-color: rgba(255, 59, 48, 0.2);
        }

        .composed-gpt-btn {
            background-color: rgba(52, 199, 89, 0.12);
            font-size: 16px;
        }

        .composed-gpt-btn:active {
            background-color: rgba(52, 199, 89, 0.22);
        }

        .composed-gpt-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .composed-go-btn {
            background-color: var(--primary-color);
            color: #FFFFFF;
        }

        .composed-go-btn:active {
            transform: scale(0.94);
        }

        .composed-go-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .composed-preview {
            margin-top: 8px;
            padding: 0 4px;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            word-break: break-all;
            min-height: 24px;
        }

        .sent-image-section {
            width: 100%;
            max-width: 360px;
            margin-top: 12px;
            display: none;
        }

        .sent-image-section.active {
            display: block;
        }

        .sent-image-section h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .sent-image-section img {
            display: block;
            width: 100%;
            border-radius: var(--radius-medium);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .settings-section {
            width: 100%;
            max-width: 360px;
            margin-top: 20px;
        }

        .settings-section h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            padding-left: 4px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-medium);
            padding: 12px 14px;
            box-shadow: var(--shadow);
        }

        .settings-row label {
            font-size: 14px;
            color: var(--text-color);
        }

        .settings-row input[type="number"] {
            width: 64px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 4px;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="controls">
            <button class="btn btn-toggle-draw" id="toggleDrawBtn" onclick="toggleDrawBoard()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
                <span id="toggleDrawBtnLabel">Hiện bảng vẽ</span>
            </button>
            <button class="btn btn-camera" id="cameraBtn" onclick="document.getElementById('cameraInput').click()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Chụp ảnh
            </button>
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
        </div>

        <div class="canvas-wrap" id="canvasWrap">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="canvas"></canvas>
            </div>

            <div class="controls">
                <button class="btn btn-clear" onclick="clearCanvas()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Xóa bảng
                </button>
            </div>
        </div>
    </div>

    <div class="results-section">
        <h2>Gợi ý kết quả</h2>
        <div id="results">
            <div class="empty-state">Chưa có nét vẽ nào</div>
        </div>
    </div>

    <div class="composed-section">
        <h2>Cụm từ đã chọn</h2>
        <div class="composed-bar">
            <div class="composed-chips" id="composedChips">
                <div class="composed-empty">Chạm vào kết quả bên trên để ghép chữ</div>
            </div>
            <button class="composed-icon-btn composed-clear-btn" id="composedClearBtn" title="Xóa cụm từ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button class="composed-icon-btn composed-gpt-btn" id="composedGptBtn" title="Nhờ ChatGPT phân tích cụm từ này" disabled>🤖</button>
            <button class="composed-icon-btn composed-go-btn" id="composedGoBtn" title="Tra cứu cụm từ này" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </button>
        </div>
        <div class="composed-preview" id="composedPreview"></div>
    </div>

    <div class="sent-image-section" id="sentImageSection">
        <h2>Ảnh đã gửi đi nhận dạng</h2>
        <img id="sentImagePreview" alt="Ảnh đã gửi để OCR">
    </div>

    <div class="settings-section">
        <h2>Cài đặt</h2>
        <div class="settings-row">
            <label for="resultLimitInput">Số lượng kết quả hiển thị tối đa</label>
            <input type="number" id="resultLimitInput" inputmode="numeric" min="5" max="50" step="1">
        </div>
    </div>

    <div class="crop-overlay" id="cropOverlay">
        <div class="crop-stage" id="cropStage">
            <img id="cropImage" src="" alt="Ảnh chụp">
            <div class="crop-box" id="cropBox">
                <div class="crop-handle handle-tl" data-handle="tl"></div>
                <div class="crop-handle handle-tr" data-handle="tr"></div>
                <div class="crop-handle handle-bl" data-handle="bl"></div>
                <div class="crop-handle handle-br" data-handle="br"></div>
            </div>
        </div>
        <p class="crop-hint">Kéo khung để chọn đúng vùng chữ Kanji</p>
        <div class="crop-actions">
            <button class="btn btn-clear" id="cropCancelBtn">Hủy</button>
            <button class="btn btn-camera" id="cropConfirmBtn">Dùng vùng này</button>
        </div>
    </div>

    <script src="../app_files/kanjiData_TvkS.js"></script>
    <script src="../app_files/kanjiData_1_TvkS.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // ===== Dữ liệu âm đọc Kanji (Hán Việt / On / Kun) để hiển thị kèm kết quả =====
        if (window._kanjiExtra && window._kanjiExtra.length) {
            kanjiData.push.apply(kanjiData, window._kanjiExtra);
        }
        const kanjiReadingMap = new Map();
        kanjiData.forEach(item => {
            if (item.kanji && !kanjiReadingMap.has(item.kanji)) {
                kanjiReadingMap.set(item.kanji, item);
            }
        });

        function getKanjiReading(kanji) {
            const item = kanjiReadingMap.get(kanji);
            if (!item) return '';
            const kun = String(item.kun_reading || '').split('|')[0].trim();
            const on = String(item.on_reading || '').split('|')[0].trim();
            return [kun, on].filter(Boolean).join(' ・ ');
        }

        const canvas = document.getElementById('canvas');
        const container = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d');
        const resultsDiv = document.getElementById('results');
        const cameraInput = document.getElementById('cameraInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const composedChips = document.getElementById('composedChips');
        const composedClearBtn = document.getElementById('composedClearBtn');
        const composedGoBtn = document.getElementById('composedGoBtn');
        const composedGptBtn = document.getElementById('composedGptBtn');
        const composedPreview = document.getElementById('composedPreview');
        const canvasWrap = document.getElementById('canvasWrap');
        const toggleDrawBtn = document.getElementById('toggleDrawBtn');
        const toggleDrawBtnLabel = document.getElementById('toggleDrawBtnLabel');

        // ===== Ẩn/hiện bảng vẽ tay (mặc định ẩn) =====
        let drawBoardVisible = false;

        function toggleDrawBoard() {
            triggerHaptic();
            drawBoardVisible = !drawBoardVisible;
            canvasWrap.classList.toggle('active', drawBoardVisible);
            toggleDrawBtn.classList.toggle('active', drawBoardVisible);
            toggleDrawBtnLabel.textContent = drawBoardVisible ? 'Ẩn bảng vẽ' : 'Hiện bảng vẽ';

            if (drawBoardVisible) {
                // canvas-wrap vừa chuyển từ display:none nên phải đo lại kích thước sau khi có layout
                requestAnimationFrame(resizeCanvas);
            }
        }

        // ===== Ghép cụm từ từ các kanji đã chọn trong kết quả =====
        let composedKanji = [];

        function renderComposed() {
            composedChips.innerHTML = '';

            if (composedKanji.length === 0) {
                composedChips.innerHTML = '<div class="composed-empty">Chạm vào kết quả bên trên để ghép chữ</div>';
                composedGoBtn.disabled = true;
                composedGptBtn.disabled = true;
                composedPreview.textContent = '';
                return;
            }

            composedGoBtn.disabled = false;
            composedGptBtn.disabled = false;
            composedPreview.textContent = composedKanji.join('');

            composedKanji.forEach((kanji, idx) => {
                const chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'composed-chip';
                chip.innerHTML = `<span>${kanji}</span><span class="composed-chip-remove">×</span>`;
                chip.onclick = () => {
                    triggerHaptic();
                    composedKanji.splice(idx, 1);
                    renderComposed();
                };
                composedChips.appendChild(chip);
            });

            // Tự cuộn sát phải để luôn thấy từ vừa thêm/cuối cùng khi danh sách bị tràn
            composedChips.scrollLeft = composedChips.scrollWidth;
        }

        function addToComposed(kanji) {
            composedKanji.push(kanji);
            renderComposed();
        }

        composedClearBtn.addEventListener('click', () => {
            triggerHaptic();
            composedKanji = [];
            renderComposed();
        });

        composedGoBtn.addEventListener('click', () => {
            if (composedKanji.length === 0) return;
            triggerHaptic();

            const combined = composedKanji.join('');
            const encoded = encodeURIComponent(combined);
            const params = new URLSearchParams(window.location.search);

            if (params.get('type') === 'vocabTab') {
                window.location.href = `../index.html?search=${encoded}#vocab`;
            } else {
                window.location.href = `../index.html?tab=kanji&kanji=${encoded}`;
            }
        });

        composedGptBtn.addEventListener('click', () => {
            if (composedKanji.length === 0) return;
            triggerHaptic();

            const combined = composedKanji.join('');
            const promptText = `Cho cụm từ tiếng Nhật sau (ghép từ các chữ Kanji theo đúng thứ tự): "${combined}".

Bước 1: Cho biết cách đọc (Hiragana) và dịch nghĩa của CẢ CỤM TỪ này trước tiên (nếu nó tạo thành một từ/cụm từ có nghĩa trong tiếng Nhật).

Bước 2: Sau đó phân tích riêng từng chữ Kanji có trong cụm, liệt kê:
- Âm Hán Việt
- Nghĩa
- Âm On (Onyomi, viết bằng Katakana)
- Âm Kun (Kunyomi, viết bằng Hiragana)
- Một từ vựng ví dụ có chứa chữ đó kèm cách đọc và nghĩa

Chỉ trả lời bằng tiếng Việt, trình bày rõ ràng theo từng bước/mục, không thêm lời dẫn thừa.`;

            const encodedPrompt = encodeURIComponent(promptText);
            window.open(`https://chatgpt.com/?q=${encodedPrompt}`, '_blank');
        });

        let isDrawing = false;
        let strokes = [];
        let currentStrokeX = [];
        let currentStrokeY = [];

        // Điều chỉnh độ phân giải màn hình Retina (iPhone)
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000000';
            
            redrawCanvas();
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes.forEach(stroke => {
                const xs = stroke[0];
                const ys = stroke[1];
                if (xs.length === 0) return;
                
                ctx.beginPath();
                ctx.moveTo(xs[0], ys[0]);
                for (let i = 1; i < xs.length; i++) {
                    ctx.lineTo(xs[i], ys[i]);
                }
                ctx.stroke();
            });
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            currentStrokeX = [];
            currentStrokeY = [];
            
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            
            currentStrokeX.push(Math.round(pos.x));
            currentStrokeY.push(Math.round(pos.y));
            
            triggerHaptic();
        }

        function draw(e) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();

            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            currentStrokeX.push(Math.round(pos.x));
            currentStrokeY.push(Math.round(pos.y));
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentStrokeX.length > 0) {
                strokes.push([currentStrokeX, currentStrokeY, []]);
                recognizeKanji();
            }
        }

        // Lắng nghe sự kiện
        window.addEventListener('resize', resizeCanvas);
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        const RESULTS_STORAGE_KEY = 'searchKanji_lastResults';
        const RESULT_LIMIT_KEY = 'searchKanji_resultLimit';
        const RESULT_LIMIT_MIN = 5;
        const RESULT_LIMIT_MAX = 50;
        const RESULT_LIMIT_DEFAULT = 20;

        function loadResultLimit() {
            const raw = parseInt(localStorage.getItem(RESULT_LIMIT_KEY), 10);
            if (isNaN(raw)) return RESULT_LIMIT_DEFAULT;
            return Math.max(RESULT_LIMIT_MIN, Math.min(RESULT_LIMIT_MAX, raw));
        }

        let resultLimit = loadResultLimit();

        const resultLimitInput = document.getElementById('resultLimitInput');
        resultLimitInput.min = RESULT_LIMIT_MIN;
        resultLimitInput.max = RESULT_LIMIT_MAX;
        resultLimitInput.value = resultLimit;

        resultLimitInput.addEventListener('change', () => {
            let val = parseInt(resultLimitInput.value, 10);
            if (isNaN(val)) val = RESULT_LIMIT_DEFAULT;
            val = Math.max(RESULT_LIMIT_MIN, Math.min(RESULT_LIMIT_MAX, val));
            resultLimit = val;
            resultLimitInput.value = val;
            localStorage.setItem(RESULT_LIMIT_KEY, String(val));
        });

        function saveResultsToStorage(candidates) {
            try {
                localStorage.setItem(RESULTS_STORAGE_KEY, JSON.stringify(candidates));
            } catch (e) {
                console.error('Không lưu được kết quả:', e);
            }
        }

        function loadResultsFromStorage() {
            try {
                const raw = localStorage.getItem(RESULTS_STORAGE_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function clearCanvas() {
            triggerHaptic();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes = [];
            resultsDiv.innerHTML = '<div class="empty-state">Chưa có nét vẽ nào</div>';
            localStorage.removeItem(RESULTS_STORAGE_KEY);
        }

        async function recognizeKanji() {
            if (strokes.length === 0) return;

            const payload = {
                app_version: 0.4,
                api_level: "537.36",
                device: "5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)",
                input_type: 0,
                options: "enable_homophone_converter",
                requests: [{
                    writer_id: "kanji-ios",
                    ink: strokes,
                    language: "ja"
                }]
            };

            try {
                const response = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=autokana', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data[0] === 'SUCCESS') {
                    const candidates = data[1][0][1];
                    // Chỉ giữ lại candidate là chữ Kanji, loại bỏ hiragana/katakana lẫn vào
                    const kanjiOnly = candidates.filter(c => /^[一-龯]+$/.test(c));
                    displayResults(kanjiOnly);
                }
            } catch (error) {
                console.error("Lỗi nhận dạng:", error);
            }
        }

        function displayResults(candidates) {
            resultsDiv.innerHTML = '';
            const topCandidates = candidates.slice(0, resultLimit);

            if (topCandidates.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">Không tìm thấy kết quả</div>';
                return;
            }

            saveResultsToStorage(topCandidates);

            topCandidates.forEach(kanji => {
                const btn = document.createElement('button');
                btn.className = 'kanji-btn';

                const reading = getKanjiReading(kanji);
                btn.innerHTML = `<span class="kanji-char">${kanji}</span>` +
                    (reading ? `<span class="kanji-reading">${reading}</span>` : '');

                btn.onclick = () => {
                    triggerHaptic();
                    addToComposed(kanji);
                };

                resultsDiv.appendChild(btn);
            });
        }

        // ===== Nhận dạng Kanji từ ảnh chụp camera (OCR) =====
        let ocrWorker = null;
        let cropObjectUrl = null;

        const cropOverlay = document.getElementById('cropOverlay');
        const cropStage = document.getElementById('cropStage');
        const cropImage = document.getElementById('cropImage');
        const cropBox = document.getElementById('cropBox');
        const cropCancelBtn = document.getElementById('cropCancelBtn');
        const cropConfirmBtn = document.getElementById('cropConfirmBtn');
        const sentImageSection = document.getElementById('sentImageSection');
        const sentImagePreview = document.getElementById('sentImagePreview');

        async function getOcrWorker() {
            if (!ocrWorker) {
                ocrWorker = await Tesseract.createWorker('jpn');
            }
            return ocrWorker;
        }

        cameraInput.addEventListener('change', handleCameraCapture);

        function handleCameraCapture(event) {
            const file = event.target.files[0];
            event.target.value = ''; // cho phép chọn lại cùng 1 ảnh lần sau
            if (!file) return;

            if (cropObjectUrl) URL.revokeObjectURL(cropObjectUrl);
            cropObjectUrl = URL.createObjectURL(file);
            cropImage.src = cropObjectUrl;
            cropImage.onload = () => {
                cropOverlay.classList.add('active');
                initCropBox();
            };
        }

        function initCropBox() {
            // Khung cắt mặc định: 80% ở giữa ảnh hiển thị
            const w = cropImage.clientWidth;
            const h = cropImage.clientHeight;
            const boxW = w * 0.8;
            const boxH = h * 0.8;
            setCropBoxRect((w - boxW) / 2, (h - boxH) / 2, boxW, boxH);
        }

        function setCropBoxRect(left, top, width, height) {
            const stageW = cropImage.clientWidth;
            const stageH = cropImage.clientHeight;
            const MIN_SIZE = 40;

            width = Math.max(MIN_SIZE, Math.min(width, stageW));
            height = Math.max(MIN_SIZE, Math.min(height, stageH));
            left = Math.max(0, Math.min(left, stageW - width));
            top = Math.max(0, Math.min(top, stageH - height));

            cropBox.style.left = left + 'px';
            cropBox.style.top = top + 'px';
            cropBox.style.width = width + 'px';
            cropBox.style.height = height + 'px';
        }

        function getCropBoxRect() {
            return {
                left: parseFloat(cropBox.style.left) || 0,
                top: parseFloat(cropBox.style.top) || 0,
                width: parseFloat(cropBox.style.width) || 0,
                height: parseFloat(cropBox.style.height) || 0
            };
        }

        // Kéo để di chuyển khung cắt
        let dragMode = null; // 'move' | 'tl' | 'tr' | 'bl' | 'br'
        let dragStart = null;

        function onCropPointerDown(e, mode) {
            e.preventDefault();
            dragMode = mode;
            const point = e.touches ? e.touches[0] : e;
            dragStart = {
                x: point.clientX,
                y: point.clientY,
                rect: getCropBoxRect()
            };
        }

        function onCropPointerMove(e) {
            if (!dragMode) return;
            if (e.cancelable) e.preventDefault();

            const point = e.touches ? e.touches[0] : e;
            const dx = point.clientX - dragStart.x;
            const dy = point.clientY - dragStart.y;
            const r = dragStart.rect;

            if (dragMode === 'move') {
                setCropBoxRect(r.left + dx, r.top + dy, r.width, r.height);
            } else if (dragMode === 'br') {
                setCropBoxRect(r.left, r.top, r.width + dx, r.height + dy);
            } else if (dragMode === 'tr') {
                setCropBoxRect(r.left, r.top + dy, r.width + dx, r.height - dy);
            } else if (dragMode === 'bl') {
                setCropBoxRect(r.left + dx, r.top, r.width - dx, r.height + dy);
            } else if (dragMode === 'tl') {
                setCropBoxRect(r.left + dx, r.top + dy, r.width - dx, r.height - dy);
            }
        }

        function onCropPointerUp() {
            dragMode = null;
            dragStart = null;
        }

        cropBox.addEventListener('mousedown', (e) => onCropPointerDown(e, 'move'));
        cropBox.addEventListener('touchstart', (e) => onCropPointerDown(e, 'move'), { passive: false });

        cropBox.querySelectorAll('.crop-handle').forEach(handle => {
            const mode = handle.dataset.handle;
            handle.addEventListener('mousedown', (e) => { e.stopPropagation(); onCropPointerDown(e, mode); });
            handle.addEventListener('touchstart', (e) => { e.stopPropagation(); onCropPointerDown(e, mode); }, { passive: false });
        });

        window.addEventListener('mousemove', onCropPointerMove);
        window.addEventListener('touchmove', onCropPointerMove, { passive: false });
        window.addEventListener('mouseup', onCropPointerUp);
        window.addEventListener('touchend', onCropPointerUp);

        function closeCropOverlay() {
            cropOverlay.classList.remove('active');
            if (cropObjectUrl) {
                URL.revokeObjectURL(cropObjectUrl);
                cropObjectUrl = null;
            }
            cropImage.src = '';
        }

        cropCancelBtn.addEventListener('click', () => {
            triggerHaptic();
            closeCropOverlay();
        });

        // Trần an toàn cho kích thước canvas: ảnh chụp từ điện thoại có thể lên tới hàng chục triệu pixel,
        // vượt giới hạn canvas của một số trình duyệt mobile (đặc biệt Safari/iOS) khiến toDataURL() trả về
        // ảnh rỗng/hỏng mà không báo lỗi. Vẫn giữ chất lượng cao hơn hẳn bản trước (700px) nhưng tránh vượt trần.
        const MAX_CROP_DIM = 2400;

        cropConfirmBtn.addEventListener('click', async () => {
            triggerHaptic();

            try {
                const rect = getCropBoxRect();
                const scaleX = cropImage.naturalWidth / cropImage.clientWidth;
                const scaleY = cropImage.naturalHeight / cropImage.clientHeight;

                const sx = rect.left * scaleX;
                const sy = rect.top * scaleY;
                const sWidth = rect.width * scaleX;
                const sHeight = rect.height * scaleY;

                const scaleDown = Math.min(1, MAX_CROP_DIM / Math.max(sWidth, sHeight));
                const outCanvas = document.createElement('canvas');
                outCanvas.width = Math.max(1, Math.round(sWidth * scaleDown));
                outCanvas.height = Math.max(1, Math.round(sHeight * scaleDown));
                const outCtx = outCanvas.getContext('2d');
                outCtx.drawImage(cropImage, sx, sy, sWidth, sHeight, 0, 0, outCanvas.width, outCanvas.height);

                sentImagePreview.src = outCanvas.toDataURL('image/jpeg', 0.95);
                sentImageSection.classList.add('active');

                closeCropOverlay();
                await runOcr(outCanvas);
            } catch (error) {
                console.error('Lỗi khi cắt ảnh:', error);
                closeCropOverlay();
                resultsDiv.innerHTML = '<div class="empty-state">Không xử lý được ảnh này, thử lại nhé</div>';
            }
        });

        async function runOcr(source) {
            cameraBtn.disabled = true;
            resultsDiv.innerHTML = '<div class="empty-state">Đang nhận dạng ảnh...</div>';

            try {
                const worker = await getOcrWorker();
                const { data } = await worker.recognize(source);
                const text = data.text || '';
                // Giữ nguyên cả cụm Kanji/Hiragana/Katakana liền nhau (không tách rời hira/kata ra khỏi kanji)
                const words = [...new Set(text.match(/[一-龯ぁ-んァ-ヶー]+/g) || [])];

                if (words.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state">Không nhận dạng được chữ nào trong ảnh</div>';
                    return;
                }

                displayResults(words);
            } catch (error) {
                console.error('Lỗi OCR:', error);
                resultsDiv.innerHTML = '<div class="empty-state">Lỗi khi nhận dạng ảnh, thử lại nhé</div>';
            } finally {
                cameraBtn.disabled = false;
            }
        }

        // Khởi tạo Canvas ban đầu
        resizeCanvas();

        // Khôi phục kết quả tìm kiếm gần nhất (nếu có) khi quay lại màn hình này
        const savedResults = loadResultsFromStorage();
        if (savedResults && savedResults.length > 0) {
            displayResults(savedResults);
        }
    </script>
</body>
</html>
