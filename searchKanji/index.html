<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nhận dạng Kanji</title>
    <style>
        :root {
            --bg-color: #F2F2F7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --primary-color: #007AFF;
            --danger-color: #FF3B30;
            --text-color: #1C1C1E;
            --text-secondary: #8E8E93;
            --border-color: #E5E5EA;
            --radius-large: 24px;
            --radius-medium: 16px;
            --radius-small: 12px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: rgba(28, 28, 30, 0.85);
                --text-color: #FFFFFF;
                --text-secondary: #8E8E93;
                --border-color: #38383A;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px) 16px;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .main-card {
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-large);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #FFFFFF;
            border-radius: var(--radius-medium);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
        }

        /* Khung đường nét đứt định vị chữ */
        .canvas-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 1px dashed #E5E5EA;
            pointer-events: none;
        }

        .canvas-container::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            border-left: 1px dashed #E5E5EA;
            pointer-events: none;
        }

        #canvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: crosshair;
            position: relative;
            z-index: 1;
        }

        .controls {
            width: 100%;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: var(--radius-small);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-clear {
            background-color: rgba(255, 59, 48, 0.1);
            color: var(--danger-color);
        }

        .btn-clear:active {
            background-color: rgba(255, 59, 48, 0.2);
            transform: scale(0.98);
        }

        .results-section {
            width: 100%;
            max-width: 360px;
            margin-top: 20px;
        }

        .results-section h2 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-left: 4px;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .kanji-btn {
            aspect-ratio: 1 / 1;
            font-size: 26px;
            font-weight: 500;
            color: var(--text-color);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-small);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: all 0.15s ease;
        }

        .kanji-btn:active {
            transform: scale(0.92);
            background: var(--primary-color);
            color: #FFFFFF;
            border-color: var(--primary-color);
        }

        .empty-state {
            grid-column: span 5;
            text-align: center;
            padding: 20px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="canvas-container" id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button class="btn btn-clear" onclick="clearCanvas()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Xóa bảng
            </button>
        </div>
    </div>

    <div class="results-section">
        <h2>Gợi ý kết quả</h2>
        <div id="results">
            <div class="empty-state">Chưa có nét vẽ nào</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const container = document.getElementById('canvasContainer');
        const ctx = canvas.getContext('2d');
        const resultsDiv = document.getElementById('results');

        let isDrawing = false;
        let strokes = [];
        let currentStrokeX = [];
        let currentStrokeY = [];

        // Điều chỉnh độ phân giải màn hình Retina (iPhone)
        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#000000';
            
            redrawCanvas();
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes.forEach(stroke => {
                const xs = stroke[0];
                const ys = stroke[1];
                if (xs.length === 0) return;
                
                ctx.beginPath();
                ctx.moveTo(xs[0], ys[0]);
                for (let i = 1; i < xs.length; i++) {
                    ctx.lineTo(xs[i], ys[i]);
                }
                ctx.stroke();
            });
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            currentStrokeX = [];
            currentStrokeY = [];
            
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            
            currentStrokeX.push(Math.round(pos.x));
            currentStrokeY.push(Math.round(pos.y));
            
            triggerHaptic();
        }

        function draw(e) {
            if (!isDrawing) return;
            if (e.cancelable) e.preventDefault();

            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();

            currentStrokeX.push(Math.round(pos.x));
            currentStrokeY.push(Math.round(pos.y));
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentStrokeX.length > 0) {
                strokes.push([currentStrokeX, currentStrokeY, []]);
                recognizeKanji();
            }
        }

        // Lắng nghe sự kiện
        window.addEventListener('resize', resizeCanvas);
        
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);

        function clearCanvas() {
            triggerHaptic();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes = [];
            resultsDiv.innerHTML = '<div class="empty-state">Chưa có nét vẽ nào</div>';
        }

        async function recognizeKanji() {
            if (strokes.length === 0) return;

            const payload = {
                app_version: 0.4,
                api_level: "537.36",
                device: "5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)",
                input_type: 0,
                options: "enable_homophone_converter",
                requests: [{
                    writer_id: "kanji-ios",
                    ink: strokes,
                    language: "ja"
                }]
            };

            try {
                const response = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=autokana', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data[0] === 'SUCCESS') {
                    const candidates = data[1][0][1];
                    displayResults(candidates);
                }
            } catch (error) {
                console.error("Lỗi nhận dạng:", error);
            }
        }

        function displayResults(candidates) {
            resultsDiv.innerHTML = '';
            const topCandidates = candidates.slice(0, 10);
            
            if (topCandidates.length === 0) {
                resultsDiv.innerHTML = '<div class="empty-state">Không tìm thấy kết quả</div>';
                return;
            }

            topCandidates.forEach(kanji => {
                const btn = document.createElement('button');
                btn.className = 'kanji-btn';
                btn.innerText = kanji;
                
                btn.onclick = () => {
                    triggerHaptic();
                    
                    // Mã hóa ký tự Kanji trước khi đưa lên URL
                    const encodedKanji = encodeURIComponent(kanji);
                    
                    // Chuyển hướng về đường dẫn yêu cầu
                    window.location.href = `../index.html?search=${encodedKanji}#vocab`;
                };
                
                resultsDiv.appendChild(btn);
            });
        }

        // Khởi tạo Canvas ban đầu
        resizeCanvas();
    </script>
</body>
</html>
