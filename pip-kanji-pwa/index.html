<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      if (location.protocol !== "http:" && location.protocol !== "https:") {
        return;
      }
      try {
        var u = new URL(location.href);
        var path = u.pathname || "/";
        if (!path.endsWith("/")) {
          var parts = path.split("/").filter(Boolean);
          var last = parts.length ? parts[parts.length - 1] : "";
          if (/\.html?$/i.test(last)) {
            parts.pop();
          }
          path = "/" + parts.join("/") + "/";
        }
        if (path === "//") {
          path = "/";
        }
        u.pathname = path || "/";
        u.hash = "";
        u.search = "";
        var b = document.createElement("base");
        b.href = u.href;
        var charset = document.querySelector("meta[charset]");
        if (charset && charset.parentNode === document.head) {
          document.head.insertBefore(b, charset.nextSibling);
        } else {
          document.head.prepend(b);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kanji PiP</title>
  <script>
    (function () {
      var p = location.protocol;
      if (p === "http:" || p === "https:") {
        var l = document.createElement("link");
        l.rel = "manifest";
        l.href = new URL("./manifest.json", document.baseURI || location.href).href;
        document.head.appendChild(l);
      }
    })();
  </script>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect fill='%230f172a' width='180' height='180' rx='24'/%3E%3Ctext x='90' y='118' font-size='72' text-anchor='middle' fill='%23e2e8f0' font-family='system-ui,sans-serif'%3E漢%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    #app {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .app-error {
      color: #fecaca;
      font-size: 0.85rem;
      text-align: center;
      margin: 0 0 12px;
      line-height: 1.45;
    }
    .app-error[hidden] { display: none !important; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
      border: 1px solid #334155;
      width: 100%;
      max-width: 360px;
    }
    #main-canvas {
      width: 100%;
      max-width: 320px;
      height: auto;
      aspect-ratio: 405 / 500;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
      background: #020617;
      touch-action: manipulation;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #0f172a;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .pip-video-wrap {
      position: fixed;
      width: 2px;
      height: 2px;
      opacity: 0.01;
      pointer-events: none;
      bottom: 0;
      right: 0;
      overflow: hidden;
    }
    #pip-video {
      width: 180px;
      height: 222px;
      object-fit: contain;
      background: #000;
    }
    .fallback {
      margin-top: 8px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      font-size: 0.8rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="app">
    <p class="app-error" id="load-status" hidden></p>
    <div class="panel" id="detail-panel" hidden>
      <canvas id="main-canvas" width="405" height="500" aria-label="Kanji"></canvas>
      <div class="row">
        <button type="button" class="btn" id="btn-pip" disabled>PiP</button>
      </div>
      <div id="fallback-box" class="fallback" hidden></div>
    </div>
  </div>

  <div class="pip-video-wrap" aria-hidden="true">
    <video id="pip-video" muted playsinline></video>
  </div>
<a href="https://luongvantien1194.github.io/jptest/index.html#kanji" class="home-link">🏠 Home</a>
  <script src="../data/kanjiData.js"></script>
  <script src="script.js"></script>
</body>
</html>
