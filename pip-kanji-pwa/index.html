<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <!-- Nhúng font Klee One từ Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
  
  <script>
    (function () {
      if (location.protocol !== "http:" && location.protocol !== "https:") {
        return;
      }
      try {
        var u = new URL(location.href);
        var path = u.pathname || "/";
        if (!path.endsWith("/")) {
          var parts = path.split("/").filter(Boolean);
          var last = parts.length ? parts[parts.length - 1] : "";
          if (/\.html?$/i.test(last)) {
            parts.pop();
          }
          path = "/" + parts.join("/") + "/";
        }
        u.pathname = path || "/";
        var b = document.createElement("base");
        b.href = u.href;
        document.head.prepend(b);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Kanji PiP</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      /* Cập nhật font chữ chính cho ứng dụng */
      font-family: 'Klee One', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: max(12px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #app { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 12px;
      border: 1px solid #334155;
      width: 100%;
      max-width: 360px;
    }
    #main-canvas {
      width: 100%;
      max-width: 320px;
      height: auto;
      aspect-ratio: 405 / 500;
      display: block;
      margin: 0 auto 10px;
      border-radius: 12px;
      background: #020617;
    }
    .row { display: flex; gap: 8px; justify-content: center; }
    .btn {
      appearance: none; border: none; border-radius: 12px;
      padding: 10px 14px; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; background: var(--accent); color: #0f172a;
    }
    .home-link { margin-top: 20px; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app">
    <div class="panel" id="detail-panel">
      <canvas id="main-canvas" width="405" height="500"></canvas>
      <div class="row">
        <button type="button" class="btn" id="btn-pip">Bật PiP</button>
      </div>
    </div>
    <a href="https://luongvantien1194.github.io/jptest/index.html#kanji" class="home-link">🏠 Home</a>
  </div>

  <div style="position: fixed; width: 1px; height: 1px; opacity: 0; overflow: hidden;">
    <video id="pip-video" muted playsinline></video>
  </div>

  <script src="../data/kanjiData.js"></script>
  <script src="script.js"></script>
</body>
</html>
